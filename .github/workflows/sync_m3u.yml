name: IPTV 自动同步
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      MAIN_URL: "https://raw.githubusercontent.com/ioptu/migu_video/main/migu.m3u"
      CCTV_URL: "https://raw.githubusercontent.com/ioptu/migu_video/main/cctv.migu.m3u"
      JINJIANG_URL: "https://raw.githubusercontent.com/2383534802/ds/refs/heads/main/jinjiang"
      OUTPUT_FILE: "iptv-fe.m3u"
      WECHAT_WEBHOOK: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=b581707c-2415-4b9e-9d0f8fdba1cb"
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 下载源文件
        shell: bash
        run: |
          set -e
          curl -fL --retry 3 --connect-timeout 20 -o jinjiang.m3u "$JINJIANG_URL"
          curl -fL --retry 3 --connect-timeout 20 -o main.m3u "$MAIN_URL"
          curl -fL --retry 3 --connect-timeout 20 -o cctv.m3u "$CCTV_URL"
          test -s jinjiang.m3u
          test -s main.m3u
          test -s cctv.m3u

      - name: 合并生成播放列表
        id: build
        shell: bash
        run: |
          set -e
          rm -f new-iptv.m3u
          echo "#EXTM3U" > new-iptv.m3u
          append_source() {
            FILE="$1"
            if head -n1 "$FILE" | grep -q "^#EXTM3U"; then
              tail -n +2 "$FILE"
            else
              cat "$FILE"
            fi
          }
          append_source jinjiang.m3u | sed -E 's/[[:space:]]*group-title="[^"]*"//g; s/(#EXTINF.*,)/\1 group-title="央视直播",/' >> new-iptv.m3u
          append_source main.m3u | sed -E 's/[[:space:]]*group-title="[^"]*"//g; s/(#EXTINF.*,)/\1 group-title="央视直播",/' >> new-iptv.m3u
          append_source cctv.m3u | sed -E 's/[[:space:]]*group-title="[^"]*"//g; s/(#EXTINF.*,)/\1 group-title="央视直播",/' >> new-iptv.m3u
          CHANNEL_COUNT=$(grep -c "^#EXTINF" new-iptv.m3u || true)
          NEW_HASH=$(sha256sum new-iptv.m3u | awk '{print $1}')
          echo "hash=$NEW_HASH" >> "$GITHUB_OUTPUT"
          echo "count=$CHANNEL_COUNT" >> "$GITHUB_OUTPUT"

      - name: 对比文件变化
        id: compare
        shell: bash
        run: |
          if [ -f "$OUTPUT_FILE" ]; then
            OLD_HASH=$(sha256sum "$OUTPUT_FILE" | awk '{print $1}')
          else
            OLD_HASH="none"
          fi
          echo "old=$OLD_HASH" >> "$GITHUB_OUTPUT"
          echo "new=${{ steps.build.outputs.hash }}" >> "$GITHUB_OUTPUT"
          if [ "$OLD_HASH" = "${{ steps.build.outputs.hash }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 更新并推送文件
        if: ${{ steps.compare.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -e
          mv new-iptv.m3u "$OUTPUT_FILE"
          git config user.name "IPTV Sync Bot"
          git config user.email "actions@github.com"
          git add "$OUTPUT_FILE"
          git commit -m "自动更新 IPTV 播放列表"
          git push origin HEAD:main --force-with-lease

      - name: 企业微信通知
        if: ${{ always() && env.WECHAT_WEBHOOK != '' }}
        shell: bash
        run: |
          STATUS="${{ job.status }}"
          CHANGED="${{ steps.compare.outputs.changed }}"
          COUNT="${{ steps.build.outputs.count }}"
          TIME=$(date '+%Y-%m-%d %H:%M:%S')
          if [ "$STATUS" = "success" ]; then
            STATUS_TEXT="✅运行成功"
          else
            STATUS_TEXT="❌运行失败"
          fi
          if [ "$CHANGED" = "true" ]; then
            RESULT_TEXT="检测更新，已推送新文件"
          else
            RESULT_TEXT="源内容无变动，未推送"
          fi
          MESSAGE="IPTV自动同步
状态：${STATUS_TEXT}
执行时间：${TIME}
频道数量：${COUNT}
结果：${RESULT_TEXT}
播放列表直链：https://raw.githubusercontent.com/2383534802/ds/refs/heads/main/iptv-fe.m3u"
          PAYLOAD=$(jq -n --arg msg "$MESSAGE" '{msgtype:"text", text:{content:$msg}}')
          curl -s -X POST "$WECHAT_WEBHOOK" -H "Content-Type:application/json" -d "$PAYLOAD"
