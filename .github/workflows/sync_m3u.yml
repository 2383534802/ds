name: IPTV 自动同步

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      MAIN_URL: "https://raw.githubusercontent.com/ioptu/migu_video/main/migu.m3u"
      CCTV_URL: "https://raw.githubusercontent.com/ioptu/migu_video/main/cctv.migu.m3u"
      JINJIANG_URL: "https://raw.githubusercontent.com/2383534802/ds/refs/heads/main/jinjinag"

      OUTPUT_FILE: "iptv-fe.m3u"
      GROUP_NAME: "央视直播"

      MAIN_SOURCE_ENABLED: "on"
      CCTV_SOURCE_ENABLED: "on"
      JINJIANG_SOURCE_ENABLED: "on"

      WECHAT_ENABLED: "on"

      # 企业微信 Webhook
      WECHAT_WEBHOOK: "YOUR_WECHAT_WEBHOOK_HERE"

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Download sources
        shell: bash
        run: |
          set -e

          echo "开始下载锦江源..."
          curl -fL --retry 3 -o jinjiang.m3u "$JINJIANG_URL"
          test -s jinjiang.m3u

          echo "开始下载主源..."
          curl -fL --retry 3 -o main.m3u "$MAIN_URL"
          test -s main.m3u

          echo "开始下载CCTV..."
          curl -fL --retry 3 -o cctv.m3u "$CCTV_URL"
          test -s cctv.m3u

          echo "三个直播源下载成功"

      - name: Build playlist
        id: build
        shell: bash
        run: |
          set -e

          rm -f new-iptv.m3u

          echo "#EXTM3U" > new-iptv.m3u

          echo "处理锦江源..."
          tail -n +2 jinjiang.m3u 2>/dev/null \
            | sed -E 's/[[:space:]]*group-title="[^"]*"//g' \
            | sed -E 's/^#EXTINF([^,]*),/#EXTINF\1 group-title="央视直播",/' \
            >> new-iptv.m3u

          echo "处理主源..."
          tail -n +2 main.m3u 2>/dev/null \
            | sed -E 's/[[:space:]]*group-title="[^"]*"//g' \
            | sed -E 's/^#EXTINF([^,]*),/#EXTINF\1 group-title="央视直播",/' \
            >> new-iptv.m3u

          echo "处理CCTV..."
          tail -n +2 cctv.m3u 2>/dev/null \
            | sed -E 's/[[:space:]]*group-title="[^"]*"//g' \
            | sed -E 's/^#EXTINF([^,]*),/#EXTINF\1 group-title="央视直播",/' \
            >> new-iptv.m3u

          COUNT=$(grep -c '^#EXTINF' new-iptv.m3u || true)

          if [ "$COUNT" -le 0 ]; then
            echo "错误：没有找到频道"
            exit 1
          fi

          HASH=$(sha256sum new-iptv.m3u | awk '{print $1}')

          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          echo "=============================="
          echo "合并成功"
          echo "锦江：第一位"
          echo "主源：第二位"
          echo "CCTV：第三位"
          echo "统一分组：央视直播"
          echo "频道数量：$COUNT"
          echo "=============================="

      - name: Compare files
        id: compare
        shell: bash
        run: |
          if [ -f "$OUTPUT_FILE" ]; then
            OLD_HASH=$(sha256sum "$OUTPUT_FILE" | awk '{print $1}')
          else
            OLD_HASH="none"
          fi

          NEW_HASH="${{ steps.build.outputs.hash }}"

          echo "旧文件：$OLD_HASH"
          echo "新文件：$NEW_HASH"

          if [ "$OLD_HASH" = "$NEW_HASH" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "文件没有变化"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "发现文件变化"
          fi

      - name: Update repository
        if: steps.compare.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          mv new-iptv.m3u "$OUTPUT_FILE"

          git config user.name "IPTV Sync Bot"
          git config user.email "actions@github.com"

          git add "$OUTPUT_FILE"

          git commit -m "自动同步 IPTV"

          git push

          echo "文件已经成功推送"

      - name: No changes
        if: steps.compare.outputs.changed == 'false'
        shell: bash
        run: |
          echo "IPTV 文件没有变化"
          echo "跳过提交"

      - name: Enterprise WeChat
        if: always() && env.WECHAT_ENABLED == 'on'
        continue-on-error: true
        shell: bash
        run: |
          if [ -z "$WECHAT_WEBHOOK" ]; then
            echo "没有填写企业微信 Webhook"
            exit 0
          fi

          if [ "$WECHAT_WEBHOOK" = "YOUR_WECHAT_WEBHOOK_HERE" ]; then
            echo "没有填写企业微信 Webhook"
            exit 0
          fi

          STATUS="${{ job.status }}"
          CHANGED="${{ steps.compare.outputs.changed }}"
          COUNT="${{ steps.build.outputs.count }}"
          TIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')

          MESSAGE="IPTV 自动同步
状态：$STATUS
时间：$TIME
同步周期：每15分钟
锦江：置顶
主源：已同步
CCTV：已同步
统一分组：央视直播
频道数量：$COUNT
文件变化：$CHANGED
到期时间：2027-12-01 00:00:00"

          curl -sS -X POST "$WECHAT_WEBHOOK" \
            -H "Content-Type: application/json" \
            --data-raw "{\"msgtype\":\"text\",\"text\":{\"content\":\"$MESSAGE\"}}"

          echo "企业微信通知已发送"

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "=============================="
          echo "IPTV 自动同步结束"
          echo "状态：${{ job.status }}"
          echo "锦江：置顶"
          echo "分组：央视直播"
          echo "周期：每15分钟"
          echo "到期：2027-12-01 00:00:00"
          echo "=============================="
