name: 同步内容到 index.php

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  sync-file:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 核心同步脚本
        run: |
          # ----- 变量定义 -----
          # 主源（直接使用 GitHub Raw，若需代理可自行替换）
          MAIN_URL="https://raw.githubusercontent.com/ioptu/migu_video/main/migu.m3u"
          # 备用源（你原有的备用地址）
          BACKUP_URL="https://pastecode.dev/raw/2i9vtj9l/paste1.txt"
          
          # 附加源（保持不变）
          FIXED_SOURCE_URL1="https://pastecode.dev/raw/eq5q34ns/%E5%9B%BA%E5%AE%9A"
          FIXED1_SWITCH="on"
          FIXED_SOURCE_URL2="https://pastecode.dev/raw/xxxx/xxxx"
          FIXED2_SWITCH="off"
          FIXED_SOURCE_URL3="https://pastecode.dev/raw/xxxx/xxxx"
          FIXED3_SWITCH="off"
          FIXED_SOURCE_URL4="https://pastecode.dev/raw/xxxx/xxxx"
          FIXED4_SWITCH="off"
          
          EXPIRE_DATETIME="2026-09-01 00:00:00"
          TASK_FLAG="expire_task_done.flag"
          GROUP_NAME="央视直播"
          GROUP_SWITCH="on"
          CURL_OPT="--connect-timeout 5 --max-time 15 --retry 2 --retry-delay 2 -L -s"

          export TZ=Asia/Shanghai
          NOW_DATETIME=$(date "+%Y-%m-%d %H:%M:%S")

          # 判断是否到期
          if [[ "$NOW_DATETIME" > "$EXPIRE_DATETIME" ]]; then
            TARGET_URL="$BACKUP_URL"
            [ ! -f "$TASK_FLAG" ] && touch "$TASK_FLAG"
            LOAD_FIXED_SOURCE="off"
          else
            TARGET_URL="$MAIN_URL"
            rm -f "$TASK_FLAG"
            LOAD_FIXED_SOURCE="on"
          fi

          # 备份并清空目标文件
          cp -f index.php index.php.bak 2>/dev/null || true
          > index.php

          # ----- 下载并验证内容是否有效 -----
          fetch_and_validate() {
            local url="$1"
            local output="$2"
            curl $CURL_OPT -o "$output" "$url"
            # 检查是否包含 Cloudflare 验证或其他无用页面
            if grep -q -E "Enable JavaScript|Just a moment|Cloudflare" "$output"; then
              echo "警告：下载的内容疑似验证页面，源无效" >&2
              return 1
            fi
            # 检查是否包含 M3U 标识（可选）
            if ! grep -q "#EXTM3U" "$output"; then
              echo "警告：下载内容不包含 #EXTM3U，可能不是有效直播源" >&2
              return 1
            fi
            return 0
          }

          # 尝试下载主源（若失败则用备用源）
          if fetch_and_validate "$TARGET_URL" "temp_source"; then
            echo "主源下载成功"
          else
            echo "主源无效，尝试使用备用源..."
            if fetch_and_validate "$BACKUP_URL" "temp_source"; then
              echo "备用源下载成功"
            else
              echo "错误：所有源均无效，放弃更新" >&2
              # 保留原 index.php 不覆盖，并退出
              rm -f temp_source
              exit 1
            fi
          fi

          # ----- 处理附加源（仅当未到期且开关开启）-----
          if [[ "$LOAD_FIXED_SOURCE" == "on" && "$FIXED1_SWITCH" == "on" ]]; then
            curl $CURL_OPT -o temp_fix1 "$FIXED_SOURCE_URL1"
            # 也可对附加源进行校验，但简单处理：直接追加
            cat temp_fix1 >> index.php
            rm -f temp_fix1
          fi

          # 替换分组名称并追加主源内容
          if [[ "$GROUP_SWITCH" == "on" ]]; then
            sed "s/group-title=\"[^\"]*\"/group-title=\"${GROUP_NAME}\"/g" temp_source > temp_format
          else
            cp temp_source temp_format
          fi
          cat temp_format >> index.php

          # 处理其余附加源
          for i in 2 3 4; do
            switch_var="FIXED${i}_SWITCH"
            url_var="FIXED_SOURCE_URL${i}"
            if [[ "$LOAD_FIXED_SOURCE" == "on" && "${!switch_var}" == "on" ]]; then
              curl $CURL_OPT -o "temp_fix${i}" "${!url_var}"
              cat "temp_fix${i}" >> index.php
              rm -f "temp_fix${i}"
            fi
          done

          # 清理临时文件
          rm -f temp_source temp_format index.php.bak

      - name: 提交推送变更
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.php
          git commit -m "自动同步：更新 index.php" || echo "无变更"
          git push

      - name: 企业微信同步通知
        if: always()
        run: |
          set +e
          WEBHOOK="https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=b581707c-2415-4b9e-958e-9d0f8fdba1cb"
          export TZ=Asia/Shanghai
          RUN_TIME=$(date "+%Y-%m-%d %H:%M:%S")
          EXPIRE_TIME="2026-09-01 00:00:00"
          ADVANCE_REMIND_DAYS=30
          FILE_LINK="https://raw.githubusercontent.com/${{ github.repository }}/main/index.php"

          if git diff --quiet HEAD -- index.php; then
            CHANGE="本次无内容变更"
          else
            CHANGE="已更新index.php内容"
          fi

          EXPIRE_TIMESTAMP=$(date -d "$EXPIRE_TIME" +%s)
          NOW_TIMESTAMP=$(date -d "$RUN_TIME" +%s)
          DIFF_DAYS=$(( (EXPIRE_TIMESTAMP - NOW_TIMESTAMP) / 86400 ))

          if [[ $DIFF_DAYS -le 0 ]]; then
            EXPIRE_TIP="到期提示：源已到期，请及时续费"
          elif [[ $DIFF_DAYS -le $ADVANCE_REMIND_DAYS ]]; then
            EXPIRE_TIP="到期提示：距离源到期还有 ${DIFF_DAYS} 天"
          else
            EXPIRE_TIP=""
          fi

          MSG="直播源同步任务报告\n====================================\n执行时间：$RUN_TIME\n运行状态：${{ job.status }}\n变更状态：$CHANGE\n到期时间：$EXPIRE_TIME\n分组名称：央视直播\n------------------------------------\n同步周期：每30分钟\n文件链接：$FILE_LINK\n====================================\n$EXPIRE_TIP"

          if [[ "${{ job.status }}" == "failure" ]]; then
            MSG="$MSG\n@all"
          fi

          curl --connect-timeout 10 --max-time 20 -H "Content-Type: application/json;charset=utf-8" -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"$MSG\"}}" "$WEBHOOK"
